openapi: 3.0.3
info:
  title: Telmate Removal Migration Verification Contract
  version: 1.0.0
  description: |
    This contract documents the phased verification workflow for removing the
    Telmate dependency. It does not describe a new user-facing production API.
paths:
  /internal/maintenance/telmate-removal/verification:
    post:
      summary: Record migration phase verification for Telmate removal
      description: |
        Documentation-only contract representing maintainer validation of phased
        migration progress, behavior preservation, and dependency removal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phaseName
                - buildStatus
                - lintStatus
                - testStatus
                - usageScanStatus
              properties:
                phaseName:
                  type: string
                buildStatus:
                  type: string
                  enum: [pass, fail]
                lintStatus:
                  type: string
                  enum: [pass, fail]
                testStatus:
                  type: string
                  enum: [pass, fail]
                usageScanStatus:
                  type: string
                  enum: [pass, fail]
                notes:
                  type: string
      responses:
        '200':
          description: Phase verification passed and migration may proceed
        '409':
          description: Phase verification failed and cleanup must stop until resolved
