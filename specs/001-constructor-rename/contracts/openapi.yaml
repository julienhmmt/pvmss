openapi: 3.1.0
info:
  title: Constructor Rename Planning Contract
  version: 1.0.0
  description: |
    Planning artifact for feature 001-constructor-rename.
    This feature is an internal mechanical refactor and does not introduce or modify runtime HTTP endpoints.
paths: {}
components:
  schemas:
    ConstructorRename:
      type: object
      required:
        - oldName
        - newName
        - packagePath
        - filePath
      properties:
        oldName:
          type: string
          description: Existing constructor symbol using the New prefix.
        newName:
          type: string
          description: Replacement constructor symbol using the Make prefix.
        packagePath:
          type: string
          description: Owning package of the constructor definition.
        filePath:
          type: string
          description: Source file containing the constructor definition.
    VerificationOutcome:
      type: object
      required:
        - formatStatus
        - testStatus
        - lintStatus
      properties:
        formatStatus:
          type: string
          enum: [pending, passed, failed]
        testStatus:
          type: string
          enum: [pending, passed, failed]
        lintStatus:
          type: string
          enum: [pending, passed, failed]
        issues:
          type: array
          items:
            type: string
