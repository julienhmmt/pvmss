{{define "search"}}
{{$lang := .Lang}}

<section class="section">
    <div class="container">
        <!-- Page Header -->
        <div class="level mb-5">
            <div class="level-left">
                <div class="level-item">
                    <h1 class="title is-3">
                        <span class="icon-text">
                            <span class="icon has-text-primary">
                                <i class="fas fa-magnifying-glass"></i>
                            </span>
                            <span>{{T "Search.Title"}}</span>
                        </span>
                    </h1>
                </div>
            </div>
            <div class="level-right">
                <div class="level-item">
                    <div class="buttons">
                        <a href="/vm/create" class="button is-primary">
                            <span class="icon"><i class="fas fa-plus-square"></i></span>
                            <span>{{T "Profile.CreateVM"}}</span>
                        </a>
                        <a href="/profile" class="button is-primary is-light has-text-dark">
                            <span class="icon"><i class="fas fa-user"></i></span>
                            <span>{{T "Profile.MyProfile"}}</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search Form Card -->
        <div class="card mb-5">
            <header class="card-header brand-header">
                <p class="card-header-title">
                    <span class="icon-text">
                        <span class="icon"><i class="fas fa-filter"></i></span>
                        <span>{{T "Search.Criterias"}}</span>
                    </span>
                </p>
            </header>
            <div class="card-content">
                <p class="mb-4 has-text-grey">{{T "Search.Subtitle"}}</p>

                <!-- Search Controls -->
                <div class="search-controls mb-4">
                    <div class="columns is-variable is-4">
                        <div class="column">
                            <div class="field">
                                <label class="label">{{T "Search.VMID"}}</label>
                                <div class="control has-icons-left">
                                    <input class="input" type="text" id="vmid-search" placeholder="{{T "Search.PlaceholderVMID"}}">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-hashtag"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="column">
                            <div class="field">
                                <label class="label">{{T "Search.Name"}}</label>
                                <div class="control has-icons-left">
                                    <input class="input" type="text" id="name-search" placeholder="{{T "Search.PlaceholderName"}}">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-server"></i>
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="column">
                            <div class="field">
                                <label class="label">{{T "Search.Tags"}}</label>
                                <div class="control has-icons-left">
                                    <input class="input" type="text" id="tags-filter" placeholder="{{T "Search.PlaceholderTag"}}">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-tags"></i>
                                    </span>
                                </div>
                                <p class="help is-size-7">{{T "Search.TagsHelp"}}</p>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="level">
                        <div class="level-left">
                            <div class="level-item">
                                <button class="button is-primary" id="search-btn">
                                    <span class="icon"><i class="fas fa-search"></i></span>
                                    <span>{{T "Search.Search"}}</span>
                                </button>
                                <button class="button is-light" id="clear-btn">
                                    <span class="icon"><i class="fas fa-times"></i></span>
                                    <span>{{T "Search.Clear"}}</span>
                                </button>
                            </div>
                        </div>
                        <div class="level-right">
                            <div class="level-item">
                                <div class="field">
                                    <label class="label is-small">{{T "Search.Limit"}}</label>
                                    <div class="control">
                                        <div class="select is-small">
                                            <select id="limit-select">
                                                <option value="25">25</option>
                                                <option value="50" selected>50</option>
                                                <option value="100">100</option>
                                                <option value="200">200</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Loading Indicator -->
                <div id="search-loading" class="has-text-centered is-hidden mb-4">
                    <div class="icon is-large has-text-primary">
                        <i class="fas fa-spinner fa-spin fa-2x"></i>
                    </div>
                    <p class="has-text-grey">{{T "Search.Searching"}}</p>
                </div>

                <!-- Error Message -->
                <div id="search-error" class="notification is-danger is-hidden">
                    <button class="delete" id="error-close"></button>
                    <span id="error-message"></span>
                </div>

                <!-- Results Summary -->
                <div id="results-summary" class="is-hidden mb-3">
                    <div class="level">
                        <div class="level-left">
                            <div class="level-item">
                                <span class="has-text-weight-semibold" id="results-text"></span>
                            </div>
                        </div>
                        <div class="level-right">
                            <div class="level-item">
                                <span class="has-text-grey is-size-7" id="search-time"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Search Results -->
        <div id="search-results" class="is-hidden">
            <div class="card">
                <header class="card-header brand-header">
                    <p class="card-header-title">
                        <span class="icon-text">
                            <span class="icon"><i class="fas fa-list"></i></span>
                            <span>{{T "Search.Results"}}</span>
                        </span>
                    </p>
                </header>
                <div class="card-content">
                    <div id="results-container">
                        <!-- Results will be loaded here via AJAX -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<script>
// AJAX-powered search functionality
(function() {
    'use strict';

    // DOM elements
    const vmidSearch = document.getElementById('vmid-search');
    const nameSearch = document.getElementById('name-search');
    const tagsFilter = document.getElementById('tags-filter');
    const limitSelect = document.getElementById('limit-select');
    const searchBtn = document.getElementById('search-btn');
    const clearBtn = document.getElementById('clear-btn');
    const searchLoading = document.getElementById('search-loading');
    const searchError = document.getElementById('search-error');
    const errorMessage = document.getElementById('error-message');
    const errorClose = document.getElementById('error-close');
    const resultsSummary = document.getElementById('results-summary');
    const resultsText = document.getElementById('results-text');
    const searchTime = document.getElementById('search-time');
    const searchResults = document.getElementById('search-results');
    const resultsContainer = document.getElementById('results-container');

    // Translations (injected from backend)
    const translations = {
        actions: '{{T "Search.Actions"}}',
        description: '{{T "Search.Description"}}',
        details: '{{T "Search.Details"}}',
        loadError: '{{T "Search.LoadError"}}',
        name: '{{T "Search.Name"}}',
        noDescription: '{{T "Search.NoDescription"}}',
        noName: '{{T "Search.NoName"}}',
        noResults: '{{T "Search.NoResults"}}',
        noResultsMessage: '{{T "Search.NoResultsMessage"}}',
        noTags: '{{T "Search.NoTags"}}',
        node: '{{T "Search.Node"}}',
        resultFound: '{{T "Search.ResultFound"}}',
        resultsFound: '{{T "Search.ResultsFound"}}',
        searchError: '{{T "Search.Error"}}',
        searching: '{{T "Search.Searching"}}',
        status: '{{T "Search.Status"}}',
        tags: '{{T "Search.Tags"}}',
        vmid: '{{T "Search.VMID"}}',
    };

    let searchTimeout = null;
    let lastSearchTime = 0;

    // Utility functions
    function showLoading() {
        searchLoading.classList.remove('is-hidden');
        searchBtn.disabled = true;
        searchBtn.innerHTML = '<span class="icon"><i class="fas fa-spinner fa-spin"></i></span><span>' + translations.searching + '</span>';
    }

    function hideLoading() {
        searchLoading.classList.add('is-hidden');
        searchBtn.disabled = false;
        searchBtn.innerHTML = '<span class="icon"><i class="fas fa-search"></i></span><span>{{T "Search.Search"}}</span>';
    }

    function showError(message) {
        errorMessage.textContent = message;
        searchError.classList.remove('is-hidden');
    }

    function hideError() {
        searchError.classList.add('is-hidden');
    }

    function showResults() {
        searchResults.classList.remove('is-hidden');
    }

    function hideResults() {
        searchResults.classList.add('is-hidden');
    }

    function updateResultsSummary(count, searchTimeMs) {
        if (count === 0) {
            resultsText.textContent = translations.noResults;
        } else if (count === 1) {
            resultsText.textContent = translations.resultFound.replace('{count}', count);
        } else {
            resultsText.textContent = translations.resultsFound.replace('{count}', count);
        }
        searchTime.textContent = searchTimeMs + 'ms';
        resultsSummary.classList.remove('is-hidden');
    }

    function hideResultsSummary() {
        resultsSummary.classList.add('is-hidden');
    }

    function getStatusBadgeClass(status) {
        switch (status) {
            case 'running': return 'is-success';
            case 'stopped': return 'is-danger';
            case 'paused':
            case 'suspended': return 'is-warning';
            default: return 'is-light';
        }
    }

    function getStatusIcon(status) {
        switch (status) {
            case 'running': return 'fa-circle-play';
            case 'stopped': return 'fa-circle-stop';
            case 'paused':
            case 'suspended': return 'fa-circle-pause';
            default: return 'fa-question-circle';
        }
    }

    function renderResults(results) {
        if (!results || results.length === 0) {
            resultsContainer.innerHTML = `
                <div class="notification is-warning">
                    <div class="level">
                        <div class="level-left">
                            <div class="level-item">
                                <div>
                                    <strong>${translations.noResults}</strong>
                                    <p class="mb-0">${translations.noResultsMessage}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            return;
        }

        let html = `
            <div class="table-container">
                <table class="table is-fullwidth is-hoverable">
                    <thead>
                        <tr class="has-background-light">
                            <th class="has-text-centered" width="80">${translations.vmid}</th>
                            <th>${translations.name}</th>
                            <th>${translations.description}</th>
                            <th class="has-text-centered" width="100">${translations.node}</th>
                            <th class="has-text-centered" width="80">${translations.status}</th>
                            <th class="has-text-centered" width="120">${translations.tags}</th>
                            <th class="has-text-centered" width="120">${translations.actions}</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        results.forEach(vm => {
            const statusClass = getStatusBadgeClass(vm.status);
            const statusIcon = getStatusIcon(vm.status);

            html += `
                <tr class="is-vcentered">
                    <td class="has-text-centered">
                        <span class="tag is-light is-medium has-text-weight-bold">${vm.vmid}</span>
                    </td>
                    <td>
                        <div class="is-flex is-align-items-center">
                            <span class="has-text-weight-semibold">${vm.name || `<em class="has-text-grey-light">${translations.noName}</em>`}</span>
                        </div>
                    </td>
                    <td>
                        <span>${vm.description || `<em class="has-text-grey-light">${translations.noDescription}</em>`}</span>
                    </td>
                    <td class="has-text-centered">
                        <span class="tag is-medium">${vm.node}</span>
                    </td>
                    <td class="has-text-centered">
                        <span class="tag ${statusClass} is-medium">
                            <span class="icon is-small"><i class="fas ${statusIcon}"></i></span>
                            <span>${vm.status}</span>
                        </span>
                    </td>
                    <td class="has-text-centered">
                        ${vm.tags ? vm.tags.split(/[,;]/).map(tag => tag.trim()).filter(tag => tag && tag !== 'pvmss').map(tag => `<span class="tag is-small is-info is-light">${tag}</span>`).join(' ') : `<em class="has-text-grey-light is-size-7">${translations.noTags}</em>`}
                    </td>
                    <td class="has-text-centered">
                        <a href="/vm/details/${vm.vmid}" class="button is-small is-primary">
                            <span class="icon"><i class="fas fa-eye"></i></span>
                            <span>${translations.details}</span>
                        </a>
                    </td>
                </tr>
            `;
        });

        html += `
                    </tbody>
                </table>
            </div>
        `;

        resultsContainer.innerHTML = html;
    }

    async function performSearch() {
        const params = new URLSearchParams({
            vmid: vmidSearch.value.trim(),
            name: nameSearch.value.trim(),
            tags: tagsFilter.value.trim(),
            limit: limitSelect.value
        });

        const startTime = Date.now();
        showLoading();
        hideError();
        hideResultsSummary();

        try {
            const response = await fetch(`/api/search/vms?${params}`, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Cache-Control': 'no-cache'
                }
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const data = await response.json();
            const searchTimeMs = Date.now() - startTime;

            if (data.success) {
                renderResults(data.results);
                updateResultsSummary(data.count, searchTimeMs);
                showResults();
            } else {
                showError(data.error || translations.searchError);
                hideResults();
            }
        } catch (error) {
            console.error('Search error:', error);
            showError(translations.loadError);
            hideResults();
        } finally {
            hideLoading();
        }
    }

    function debouncedSearch() {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(performSearch, 500);
    }

    function clearSearch() {
        vmidSearch.value = '';
        nameSearch.value = '';
        tagsFilter.value = '';
        limitSelect.value = '50';
        hideResults();
        hideResultsSummary();
        hideError();
    }

    // Event listeners
    searchBtn.addEventListener('click', performSearch);
    clearBtn.addEventListener('click', clearSearch);
    errorClose.addEventListener('click', hideError);

    // Auto-search on input changes (debounced)
    [vmidSearch, nameSearch, tagsFilter].forEach(input => {
        input.addEventListener('input', debouncedSearch);
    });

    limitSelect.addEventListener('change', debouncedSearch);

    // Search on Enter key
    [vmidSearch, nameSearch, tagsFilter].forEach(input => {
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                performSearch();
            }
        });
    });

    // Initial search if we have any filters set
    if (vmidSearch.value || nameSearch.value || tagsFilter.value) {
        performSearch();
    }
})();
</script>
{{end}}
