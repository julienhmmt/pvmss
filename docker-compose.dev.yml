---
services:
  pvmss-dev:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: pvmss-dev
    env_file:
      - .env
    environment:
      # Verbose logs (override .env). Lowercase only.
      LOG_LEVEL: debug
      LOG_FORMAT: console
      LOG_OUTPUT: stdout
      # SQLite runs in WAL mode (-wal/-shm next to the file), so persist the
      # whole /data directory, never a single file. Overrides .env.
      PVMSS_DB_PATH: /data/pvmss.db
      # Dev DBs outlive schema squashes: move an incompatible one aside
      # (pvmss.db.incompatible-<time>) and start fresh instead of crash-looping.
      PVMSS_DB_RESET_ON_INCOMPATIBLE: "true"
      # Mutual TLS on the listener: only clients holding a cert from the dev
      # CA (the proxies, Vite) get in. See docs/tls.md.
      PVMSS_TLS_CERT_FILE: /certs/pvmss.crt
      PVMSS_TLS_KEY_FILE: /certs/pvmss.key
      PVMSS_TLS_CLIENT_CA_FILE: /certs/ca.crt
    # Not published: reach PVMSS through one of the reverse proxies below
    # (https://localhost:50000-50004), the way production does.
    expose:
      - "50000"
    volumes:
      - pvmss_dev_data:/data
      - ./dev/proxies/certs:/certs:ro
    depends_on:
      proxy-certs:
        condition: service_completed_successfully
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  # --- Reverse proxies in front of pvmss-dev (one port each) ---------------
  # Mutual TLS on both hops: browser -> proxy needs dev/proxies/certs/client.p12
  # (password pvmss), proxy -> pvmss-dev uses proxy-client.pem. Trust ca.crt
  # once instead of accepting a self-signed certificate per port.
  # Configs live in dev/proxies/. See README "Behind a reverse proxy".
  proxy-certs:
    image: alpine:3.24
    container_name: pvmss-proxy-certs
    restart: "no"
    command: /gen-cert.sh
    volumes:
      - ./dev/proxies/gen-cert.sh:/gen-cert.sh:ro
      - ./dev/proxies/certs:/certs

  # 50000: HTTP/2 + Host rewritten to an internal name (prod-like setup).
  proxy-haproxy:
    image: haproxy:lts-alpine
    container_name: pvmss-proxy-haproxy
    restart: unless-stopped
    ports:
      - "50000:50000"
    volumes:
      - ./dev/proxies/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./dev/proxies/certs:/certs:ro
    depends_on:
      proxy-certs:
        condition: service_completed_successfully
      pvmss-dev:
        condition: service_started

  # 50001: classic nginx WebSocket recipe.
  proxy-nginx:
    image: nginx:stable-alpine
    container_name: pvmss-proxy-nginx
    restart: unless-stopped
    ports:
      - "50001:50001"
    volumes:
      - ./dev/proxies/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dev/proxies/certs:/certs:ro
    depends_on:
      proxy-certs:
        condition: service_completed_successfully
      pvmss-dev:
        condition: service_started

  # 50002: Caddy, WebSockets over HTTP/1.1 and HTTP/2 out of the box.
  proxy-caddy:
    image: caddy:2.11-alpine
    container_name: pvmss-proxy-caddy
    restart: unless-stopped
    ports:
      - "50002:50002"
    volumes:
      - ./dev/proxies/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dev/proxies/certs:/certs:ro
    depends_on:
      proxy-certs:
        condition: service_completed_successfully
      pvmss-dev:
        condition: service_started

  # 50003: Traefik (file provider).
  proxy-traefik:
    image: traefik:langres
    container_name: pvmss-proxy-traefik
    restart: unless-stopped
    command:
      - --entrypoints.websecure.address=:50003
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "50003:50003"
    volumes:
      - ./dev/proxies/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./dev/proxies/certs:/certs:ro
    depends_on:
      proxy-certs:
        condition: service_completed_successfully
      pvmss-dev:
        condition: service_started

  # 50004: Nginx Proxy Manager (HTTPS, mTLS via advanced config). Admin UI on http://localhost:50081,
  # loopback only: it keeps the first-boot admin (admin@example.com/changeme).
  # dev/proxies/npm-setup.sh creates the proxy host localhost ->
  # https pvmss-dev:50000 with WebSockets on (make proxy-e2e runs it). NPM keeps
  # "localhost" for its own default site: open https://pvmss.localhost:50004.
  proxy-npm:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: pvmss-proxy-npm
    restart: unless-stopped
    ports:
      - "127.0.0.1:50004:443"
      - "127.0.0.1:50081:81"
    volumes:
      - proxy_npm_data:/data
      - proxy_npm_letsencrypt:/etc/letsencrypt
      - ./dev/proxies/certs:/certs:ro
    depends_on:
      - pvmss-dev

volumes:
  pvmss_dev_data: {}
  proxy_npm_data: {}
  proxy_npm_letsencrypt: {}
