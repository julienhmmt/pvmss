---
services:
  pvmss-dev:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: pvmss-dev
    env_file:
      - .env
    environment:
      # Cloud-init templates: PVMSS publishes them to every Proxmox node over
      # SSH with this key. The SSH user, port and pinned host keys are set per
      # cluster in Admin > Clusters. Full procedure: docs/cloud-init-ssh.md.
      PVMSS_SSH_KEY_FILE: /etc/pvmss/ssh/id_ed25519
    ports:
      - "50000:50000/tcp"
    volumes:
      - ./pvmss.db:/app/pvmss.db
      # Generate the key BEFORE the first `up` (otherwise Docker creates an
      # empty directory here and the server refuses to start):
      #   ssh-keygen -t ed25519 -N '' -C pvmss -f pvmss_snippets_ed25519
      #   chmod 0644 pvmss_snippets_ed25519   # dev only: readable by uid 65532
      # To run without cloud-init templates, comment out this line and
      # PVMSS_SSH_KEY_FILE above.
      - ./pvmss_snippets_ed25519:/etc/pvmss/ssh/id_ed25519:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  web-dev:
    # Bun installs deps; Node runs the Vite dev server. Bun cannot run Vite's
    # WebSocket dev-proxy (its http.request emits 'response' instead of
    # 'upgrade' for 101), which breaks the VNC console WebSocket. See
    # Dockerfile.web-dev.
    build:
      context: .
      dockerfile: Dockerfile.web-dev
    working_dir: /app
    restart: unless-stopped
    container_name: web-dev
    env_file:
      - .env
    environment:
      # Vite proxy target - the Go backend on the docker network.
      VITE_BACKEND_URL: http://pvmss-dev:50000
      # ORIGIN controls the public base for Vite asset URLs and HMR.
      # For OrbStack TLS access via https://web-dev.pvmss.orb.local (standard port),
      # set ORIGIN=https://web-dev.pvmss.orb.local (no port) in your local .env
      # (or shell). This makes the HMR client connect via wss://... without :5173.
      ORIGIN: ${ORIGIN:-http://localhost:5173}
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    command: sh -c "bun install && node node_modules/vite/bin/vite.js dev --host 0.0.0.0 --port 5173"
    depends_on:
      - pvmss-dev
