---
services:
  pvmss-dev:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: pvmss-dev
    env_file:
      - .env
    environment:
      # Verbose logs (override .env). Lowercase only.
      LOG_LEVEL: debug
      LOG_FORMAT: console
      LOG_OUTPUT: stdout
      # SQLite runs in WAL mode (-wal/-shm next to the file), so persist the
      # whole /data directory, never a single file. Overrides .env.
      PVMSS_DB_PATH: /data/pvmss.db
      # Dev DBs outlive schema squashes: move an incompatible one aside
      # (pvmss.db.incompatible-<time>) and start fresh instead of crash-looping.
      PVMSS_DB_RESET_ON_INCOMPATIBLE: "true"
    # Not published: reach PVMSS through one of the reverse proxies below
    # (https://localhost:50000-50004), the way production does.
    expose:
      - "50000"
    volumes:
      - pvmss_dev_data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

  pvmss-web-dev:
    # Bun installs deps; Node runs the Vite dev server. Bun cannot run Vite's
    # WebSocket dev-proxy (its http.request emits 'response' instead of
    # 'upgrade' for 101), which breaks the VNC console WebSocket. See
    # Dockerfile.web-dev.
    build:
      context: .
      dockerfile: Dockerfile.web-dev
    working_dir: /app
    restart: unless-stopped
    container_name: pvmss-web-dev
    env_file:
      - .env
    environment:
      # Vite proxy target - the Go backend on the docker network.
      VITE_BACKEND_URL: http://pvmss-dev:50000
      # ORIGIN controls the public base for Vite asset URLs and HMR.
      # For OrbStack TLS access via https://pvmss-web-dev.pvmss.orb.local (standard port),
      # set ORIGIN=https://pvmss-web-dev.pvmss.orb.local (no port) in your local .env
      # (or shell). This makes the HMR client connect via wss://... without :5173.
      # With ORIGIN set, open the app on that URL only: asset URLs and HMR are
      # built from it, so another host (localhost, 127.0.0.1) gets CORS-blocked
      # fonts and a failing HMR socket.
      ORIGIN: ${ORIGIN:-http://localhost:5173}
      NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: sh -c "bun install && node node_modules/vite/bin/vite.js dev --host 0.0.0.0 --port 5173"
    depends_on:
      - pvmss-dev

  # --- Reverse proxies in front of pvmss-dev (one port each) ---------------
  # All serve the same self-signed certificate (accept it once per port).
  # Configs live in dev/proxies/. See README "Behind a reverse proxy".
  proxy-certs:
    image: alpine:3.24
    container_name: pvmss-proxy-certs
    restart: "no"
    command: /gen-cert.sh
    volumes:
      - ./dev/proxies/gen-cert.sh:/gen-cert.sh:ro
      - proxy_certs:/certs

  # 50000: HTTP/2 + Host rewritten to an internal name (prod-like setup).
  proxy-haproxy:
    image: haproxy:lts-alpine
    container_name: pvmss-proxy-haproxy
    restart: unless-stopped
    ports:
      - "50000:50000"
    volumes:
      - ./dev/proxies/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - proxy_certs:/certs:ro
    depends_on:
      proxy-certs:
        condition: service_completed_successfully
      pvmss-dev:
        condition: service_started

  # 50001: classic nginx WebSocket recipe.
  proxy-nginx:
    image: nginx:stable-alpine
    container_name: pvmss-proxy-nginx
    restart: unless-stopped
    ports:
      - "50001:50001"
    volumes:
      - ./dev/proxies/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - proxy_certs:/certs:ro
    depends_on:
      proxy-certs:
        condition: service_completed_successfully
      pvmss-dev:
        condition: service_started

  # 50002: Caddy, WebSockets over HTTP/1.1 and HTTP/2 out of the box.
  proxy-caddy:
    image: caddy:2.11-alpine
    container_name: pvmss-proxy-caddy
    restart: unless-stopped
    ports:
      - "50002:50002"
    volumes:
      - ./dev/proxies/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy_certs:/certs:ro
    depends_on:
      proxy-certs:
        condition: service_completed_successfully
      pvmss-dev:
        condition: service_started

  # 50003: Traefik (file provider).
  proxy-traefik:
    image: traefik:langres
    container_name: pvmss-proxy-traefik
    restart: unless-stopped
    command:
      - --entrypoints.websecure.address=:50003
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "50003:50003"
    volumes:
      - ./dev/proxies/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - proxy_certs:/certs:ro
    depends_on:
      proxy-certs:
        condition: service_completed_successfully
      pvmss-dev:
        condition: service_started

  # 50004: Nginx Proxy Manager, plain HTTP. Admin UI on http://localhost:50081.
  # dev/proxies/npm-setup.sh creates the proxy host localhost ->
  # http pvmss-dev:50000 with WebSockets on (make proxy-e2e runs it).
  proxy-npm:
    image: jc21/nginx-proxy-manager:2.16.0
    container_name: pvmss-proxy-npm
    restart: unless-stopped
    ports:
      - "50004:80"
      - "50081:81"
    volumes:
      - proxy_npm_data:/data
      - proxy_npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - pvmss-dev

  # SonarQube Community Build for local analysis (make sonar-*).
  sonarqube:
    image: sonarqube:26.6.0.123539-community
    container_name: pvmss-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      # Disable Elasticsearch bootstrap checks so the container starts locally
      # without tuning vm.max_map_count on Docker Desktop / OrbStack.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  # One-shot scanner, only run via tools/sonar-scan.sh (profile keeps it out of `up`).
  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:12.1.0.3233_8.0.1
    container_name: pvmss-sonar-scanner
    restart: "no"
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
    volumes:
      - .:/usr/src
      - sonar_cache:/opt/sonar-scanner/.sonar
    working_dir: /usr/src
    depends_on:
      - sonarqube
    profiles:
      - scan

volumes:
  pvmss_dev_data: {}
  proxy_certs: {}
  proxy_npm_data: {}
  proxy_npm_letsencrypt: {}
  sonarqube_data: {}
  sonarqube_logs: {}
  sonarqube_extensions: {}
  sonar_cache: {}
