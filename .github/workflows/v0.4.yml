name: v0.4

permissions:
  contents: read

on:
  push:
    branches: ["main", "v0.4"]
  pull_request:
    branches: ["main"]

jobs:
  go:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Verify Go dependencies
        run: go mod verify
        working-directory: server

      - name: Build Go server
        run: go build ./...
        working-directory: server

      - name: Run Go tests with race detector
        run: go test -race ./...
        working-directory: server

      - name: Scan Go dependencies for known vulnerabilities
        # Pinned like golangci-lint in lint.yml; keep in sync with the Makefile if added there.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: server

  image:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Build container image (no push)
        run: docker build .

  helm:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.20.2

      - name: Lint Helm chart
        # CI-only dummy value; the chart fails to render without a 32+ byte session secret.
        run: helm lint ./helm --set secrets.sessionSecret=ci-only-dummy-session-secret-000000

  web:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version

      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Type check
        run: bun run check
        working-directory: web

      - name: Lint
        run: bun run lint
        working-directory: web

      - name: Build web shell
        run: bun run build
        working-directory: web

      - name: Run Vitest
        run: bun run test
        working-directory: web

  e2e:
    runs-on: ubuntu-26.04
    needs: [go, web]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: web/.bun-version

      - name: Install web dependencies
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
        working-directory: web

      - name: Run Playwright E2E
        run: bun run test:e2e
        working-directory: web

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14
