# CI for the v0.4 stack: Go API in server/ and SvelteKit SPA in web/.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  server:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: server/go.mod
        cache: true
        cache-dependency-path: server/go.sum

    - name: Verify dependencies
      run: go mod verify
      working-directory: server

    - name: Build
      run: go build -v ./...
      working-directory: server

    # server-test already runs with -race, so no separate race job is needed.
    # Tests drive the "fake" cluster source and need no Proxmox credentials.
    - name: Test (race detector)
      run: make server-test

  web:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      working-directory: web
      run: bun install --frozen-lockfile

    - name: Type check (svelte-check)
      working-directory: web
      run: bun run check

    - name: Lint (eslint)
      working-directory: web
      run: bun run lint

    - name: Test (vitest)
      working-directory: web
      run: bun run test
