# PVMSS - plain Kubernetes manifests (no Helm), Gateway API for exposure.
#
# Prerequisites:
#   - Gateway API CRDs (v1):
#       kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.3.0/standard-install.yaml
#   - A Gateway controller (Envoy Gateway, Cilium, Istio, Traefik, NGINX Gateway Fabric, ...)
#     and its GatewayClass. Set gatewayClassName below to match.
#   - A TLS Secret "pvmss-tls" in namespace pvmss (cert-manager or manual).
#
# Before applying, edit every "changeme" value, then:
#   kubectl apply -f pvmss.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: pvmss
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pvmss
  namespace: pvmss
  labels:
    app.kubernetes.io/name: pvmss
    app.kubernetes.io/instance: pvmss
automountServiceAccountToken: false
---
# Prefer creating this Secret out of band (SealedSecrets, External Secrets, SOPS).
#   session-secret: openssl rand -hex 32  (32+ bytes, required)
#   admin-password-hash: optional bcrypt ("$2y$10$..."), enables the bootstrap "admin" account
apiVersion: v1
kind: Secret
metadata:
  name: pvmss-secrets
  namespace: pvmss
  labels:
    app.kubernetes.io/name: pvmss
    app.kubernetes.io/instance: pvmss
type: Opaque
stringData:
  session-secret: "changeme-generate-with-openssl-rand-hex-32"
  pve-api-token: "changeme"
  admin-password-hash: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pvmss-config
  namespace: pvmss
  labels:
    app.kubernetes.io/name: pvmss
    app.kubernetes.io/instance: pvmss
data:
  # "fake" serves demo data with demo credentials: never use it in production.
  PVMSS_CLUSTER_SOURCE: "proxmox"
  # Seeds the "default" cluster on first boot only; the admin UI owns clusters afterwards.
  PROXMOX_URL: "https://changeme:8006/api2/json"
  PROXMOX_API_TOKEN_NAME: "user@pve!token"
  PVMSS_PORT: "50000"
  PVMSS_HOST: "0.0.0.0"
  PVMSS_DB_PATH: "/data/pvmss.db"
  PVMSS_WEB_DIR: "/app/web/build"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  LOG_OUTPUT: "stdout"
  # The Gateway terminates TLS, so cookies must stay Secure.
  PVMSS_COOKIE_SECURE: "true"
  # One proxy (the Gateway) appends to X-Forwarded-For.
  PVMSS_TRUSTED_PROXY_HOPS: "1"
  TZ: "Europe/Paris"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvmss-db
  namespace: pvmss
  labels:
    app.kubernetes.io/name: pvmss
    app.kubernetes.io/instance: pvmss
spec:
  accessModes:
    - ReadWriteOnce
  # storageClassName: changeme   # omit to use the cluster default
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvmss
  namespace: pvmss
  labels:
    app.kubernetes.io/name: pvmss
    app.kubernetes.io/instance: pvmss
spec:
  # Must stay 1: SQLite, rate limits and quota reservations live in one process.
  replicas: 1
  # Recreate: the RWO volume cannot be mounted by two pods during a rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pvmss
      app.kubernetes.io/instance: pvmss
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pvmss
        app.kubernetes.io/instance: pvmss
    spec:
      serviceAccountName: pvmss
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 5
      containers:
        - name: pvmss
          image: jhmmt/pvmss:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 50000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: pvmss-config
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: pvmss-secrets
                  key: session-secret
            - name: PROXMOX_API_TOKEN_VALUE
              valueFrom:
                secretKeyRef:
                  name: pvmss-secrets
                  key: pve-api-token
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: pvmss-secrets
                  key: admin-password-hash
                  optional: true
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvmss-db
---
apiVersion: v1
kind: Service
metadata:
  name: pvmss
  namespace: pvmss
  labels:
    app.kubernetes.io/name: pvmss
    app.kubernetes.io/instance: pvmss
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pvmss
    app.kubernetes.io/instance: pvmss
  ports:
    - name: http
      port: 50000
      targetPort: http
      protocol: TCP
---
# Scaffold Gateway. Skip it and point the HTTPRoute parentRefs at your
# existing shared Gateway if you already have one.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pvmss
  namespace: pvmss
spec:
  gatewayClassName: changeme   # e.g. envoy-gateway, cilium, istio, traefik, nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: pvmss.example.com
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: pvmss.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: pvmss-tls
      allowedRoutes:
        namespaces:
          from: Same
---
# HTTP -> HTTPS redirect (session cookies are Secure).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pvmss-redirect
  namespace: pvmss
spec:
  parentRefs:
    - name: pvmss
      sectionName: http
  hostnames:
    - pvmss.example.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# Also carries the VNC console WebSocket (HTTP Upgrade is supported by v1 HTTPRoute).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pvmss
  namespace: pvmss
  labels:
    app.kubernetes.io/name: pvmss
    app.kubernetes.io/instance: pvmss
spec:
  parentRefs:
    - name: pvmss
      sectionName: https
  hostnames:
    - pvmss.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: pvmss
          port: 50000
