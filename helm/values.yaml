# GLOBAL SETTINGS
namespace: pvmss
createNamespace: true

# SERVICE ACCOUNT
serviceAccount:
  create: true
  name: "pvmss-sa"
  # PVMSS does not call the Kubernetes API; keep false unless sidecars need it.
  automountToken: false
  annotations: {}

# SECRETS
# Recommended with GitOps (ArgoCD, Flux): create the Secret yourself (SealedSecrets,
# External Secrets, SOPS, ...) and set existingSecret. It must hold the keys
# admin-password-hash (optional), pve-api-token and session-secret.
# Otherwise the chart creates the Secret from the plain values below.
secrets:
  existingSecret: ""
  # Optional bcrypt hash for the bootstrap local admin account ("admin").
  # Leave both empty to disable the bootstrap local admin.
  # The hash contains "$" ("$2y$10$..."), which ArgoCD parameters, shells and
  # envsubst can strip or expand. Prefer the base64 form, which has no "$":
  #   htpasswd -bnBC 10 "" 'StrongPassword' | tr -d ':\n' | base64
  # adminPasswordHashBase64 wins when both are set. In a values file, always
  # single-quote the plain hash: adminPasswordHash: '$2y$10$...'
  adminPasswordHashBase64: ""
  adminPasswordHash: ""
  # Proxmox API token secret (the value matching deployment.env.PROXMOX_API_TOKEN_NAME).
  pveApiToken: changeme
  # Required, 32+ bytes. Generate with: openssl rand -hex 32
  # (the server refuses the README example value).
  sessionSecret: ""

# PERSISTENCE (PVCs)
persistence:
  db:
    enabled: true
    size: 1Gi
    storageClass: ""
  # Only needed when deployment.env.LOG_OUTPUT is set to a path under /data/logs.
  logs:
    enabled: false
    size: 1Gi
    storageClass: ""

# DEPLOYMENT
deployment:
  # Must stay 1: SQLite, rate-limit counters and in-flight create reservations
  # live in one process. More replicas multiply the rate limits and break the
  # quota check.
  replicaCount: 1
  strategy: Recreate
  image:
    repository: jhmmt/pvmss
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "25m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  # Probe timings. The chart picks the handler from tls.*: httpGet /health
  # (HTTPS when TLS is on), or tcpSocket in strict mTLS where the kubelet
  # cannot present a client certificate.
  livenessProbe:
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  # Extra env entries (full EnvVar objects, valueFrom allowed) and envFrom sources.
  # Example: mount a SIEM receiver CA from a Secret and enable the syslog sink
  # (see docs/observability.md, "Ship logs to a SIEM"):
  #   extraVolumes: [{name: siem-ca, secret: {secretName: pvmss-siem-ca}}]
  #   extraVolumeMounts: [{name: siem-ca, mountPath: /etc/pvmss/siem, readOnly: true}]
  #   extraEnv: [{name: PVMSS_SYSLOG_ADDR, value: "siem.example.internal:6514"},
  #              {name: PVMSS_SYSLOG_TLS_CA_FILE, value: /etc/pvmss/siem/ca.crt}]
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  # Every variable is validated at boot by server/internal/config/load.go;
  # the pod crash-loops if a required one is missing or malformed.
  env:
    # Required. "proxmox" for a real cluster; "fake" serves demo data with demo
    # credentials and must never be selected by accident (no default).
    PVMSS_CLUSTER_SOURCE: "proxmox"
    # Seed the initial "default" cluster on first boot (managed via Admin UI afterwards).
    PROXMOX_URL: "https://changeme:8006/api2/json"
    PROXMOX_API_TOKEN_NAME: "user@pve!token"
    PVMSS_PORT: "50000"
    PVMSS_DB_PATH: "/data/pvmss.db"
    # Bind all interfaces inside the container; the Service controls exposure.
    PVMSS_HOST: "0.0.0.0"
    PVMSS_WEB_DIR: "/app/web/build"
    # Lowercase only: debug | info | warn | error
    LOG_LEVEL: "info"
    # json (SIEM/Loki) | console
    LOG_FORMAT: "json"
    # stdout | stderr | a writable file path (e.g. /data/logs/pvmss.log with persistence.logs.enabled=true)
    LOG_OUTPUT: "stdout"
    # Set to "false" only when the HTTPRoute/Ingress does not terminate TLS.
    PVMSS_COOKIE_SECURE: "true"
    # Number of reverse proxies that append to X-Forwarded-For in front of PVMSS
    # (client IP for rate limits / audit). Set "0" when nothing proxies.
    PVMSS_TRUSTED_PROXY_HOPS: "1"
    # Optional tuning (uncomment to override defaults):
    # PVMSS_INVENTORY_REFRESH_INTERVAL: "30s"
    # PVMSS_INVENTORY_MANUAL_REFRESH_MIN_INTERVAL: "5s"
    # PVMSS_INVENTORY_REFRESH_TIMEOUT: "15s"
    # PVMSS_MAX_LIST_PAGE_SIZE: "100"
    # PVMSS_MAX_LOCAL_ADMINS: "5"
    # PVMSS_RATE_LIMIT_MAX: "0"
    # PVMSS_DB_RESET_ON_INCOMPATIBLE: "false"
    # Optional OpenTelemetry OTLP/HTTP export (see docs/observability.md):
    # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
    # OTEL_SERVICE_NAME: "pvmss"
    # OTEL_SDK_DISABLED: "false"
    TZ: "Europe/Paris"

# NATIVE TLS / MUTUAL TLS (docs/tls.md)
# Encrypts the Gateway-to-PVMSS hop. Mutual TLS is recommended: only clients
# with a certificate from clientCA reach the pod, even from inside the cluster.
# Certificates are read once at startup: restart the pod after renewal (or let
# a reloader do it, e.g. extraAnnotations: reloader.stakater.com/auto: "true").
tls:
  enabled: false
  # kubernetes.io/tls Secret with tls.crt (full chain) and tls.key. Ignored
  # when certManager.enabled (the Certificate writes this Secret).
  secretName: ""
  certManager:
    enabled: false
    # Defaults to <fullname>-tls when secretName is empty.
    issuerRef:
      name: ""
      kind: ClusterIssuer
    # SANs the proxy dials. Default: the Service DNS names.
    dnsNames: []
    duration: 2160h
    renewBefore: 360h
  clientCA:
    # Turns on mTLS. The Secret (or ConfigMap) key holds the PEM CA bundle that
    # signs client certificates (extendedKeyUsage=clientAuth).
    enabled: false
    # Required: Secret with a CA dedicated to client certificates. Never reuse
    # the server issuer's CA: every cert it signs would then be let in.
    secretName: ""
    key: ca.crt
    # require: no valid client cert, no connection. optional: verified when sent.
    clientAuth: require

# METRICS
# Prometheus pull endpoint. Off by default. When enabled the pod serves
# GET /metrics on its own port (PVMSS_METRICS_PORT), separate from the app port,
# with no authentication: keep it cluster-internal (the HTTPRoute never routes
# it) and restrict it with a NetworkPolicy if the cluster is shared.
metrics:
  enabled: false
  port: 9464
  # Requires the Prometheus Operator CRDs. Only rendered when metrics.enabled.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# SERVICE
service:
  type: ClusterIP
  port: 50000
  targetPort: 50000
  # Only used when type=NodePort
  nodePort: null

# GATEWAY-API (gateway.networking.k8s.io/v1)
# Optional Gateway scaffold. Leave disabled to attach to an existing Gateway.
gateway:
  enabled: false
  className: ""
  annotations: {}
  hostname: pvmss.example.com
  # kubernetes.io/tls Secret for the HTTPS listener (browser-facing).
  tlsSecretName: pvmss-gateway-tls
  # Adds an HTTP listener and an HTTPRoute redirecting it to HTTPS.
  httpRedirect: true

httpRoute:
  enabled: false
  annotations: {}
  # Which Gateways this Route is attached to. With gateway.enabled, leave empty
  # to attach to the chart's Gateway (https listener).
  parentRefs:
    - name: gateway
      sectionName: http
      namespace: gateway-system
  # Hostnames matching HTTP header.
  hostnames:
    - pvmss.example.com
  # When tls.enabled, the Gateway must speak HTTPS to the pod. This renders a
  # BackendTLSPolicy (standard channel v1 since Gateway API 1.4; set
  # apiVersion to v1alpha3 for older CRDs). Client certificates for mTLS are
  # configured on the Gateway/controller side (Gateway spec.tls.backend in 1.4).
  backendTLSPolicy:
    enabled: false
    apiVersion: gateway.networking.k8s.io/v1
    # Must match a SAN of the PVMSS certificate.
    hostname: ""
    # ConfigMap(s) holding the CA that signed the PVMSS server certificate.
    caCertificateRefs: []
    # - group: ""
    #   kind: ConfigMap
    #   name: pvmss-ca
    # Or trust the controller's system roots instead:
    wellKnownCACertificates: ""
  # List of rules and filters applied.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

# OPTIONAL CUSTOMISATIONS
extraAnnotations: {}
extraLabels: {}
podAnnotations: {}
podLabels: {}
imagePullSecrets: []
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
