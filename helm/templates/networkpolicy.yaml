{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pvmss.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pvmss.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pvmss.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: backend
          protocol: TCP
      {{- with .Values.networkPolicy.appFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if .Values.metrics.enabled }}
    - ports:
        - port: metrics
          protocol: TCP
      {{- with .Values.networkPolicy.metricsFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
{{- end }}
