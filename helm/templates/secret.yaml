{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pvmss.secretName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "pvmss.labels" . | nindent 4 }}
  {{- with .Values.extraAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  admin-password-hash: {{ include "pvmss.adminPasswordHash" . | b64enc | quote }}
  pve-api-token: {{ .Values.secrets.pveApiToken | b64enc | quote }}
  session-secret: {{ required "secrets.sessionSecret is required (openssl rand -hex 32), or set secrets.existingSecret" .Values.secrets.sessionSecret | b64enc | quote }}
{{- end }}
