apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pvmss.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "pvmss.labels" . | nindent 4 }}
  {{- with .Values.extraAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  strategy:
    type: {{ .Values.deployment.strategy }}
  selector:
    matchLabels:
      {{- include "pvmss.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pvmss.labels" . | nindent 8 }}
      annotations:
        {{- if not .Values.secrets.existingSecret }}
        # Roll the pod when chart-managed secrets change.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.extraAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 5
      containers:
        - name: pvmss
          image: "{{ .Values.deployment.image.repository }}:{{ default .Chart.AppVersion .Values.deployment.image.tag }}"
          imagePullPolicy: {{ .Values.deployment.image.pullPolicy }}
          ports:
            - name: backend
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
          env:
            # Secrets
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: {{ include "pvmss.secretName" . }}
                  key: admin-password-hash
                  optional: true
            - name: PROXMOX_API_TOKEN_VALUE
              valueFrom:
                secretKeyRef:
                  name: {{ include "pvmss.secretName" . }}
                  key: pve-api-token
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "pvmss.secretName" . }}
                  key: session-secret
            {{- if .Values.metrics.enabled }}
            - name: PVMSS_METRICS_PORT
              value: "{{ .Values.metrics.port }}"
            {{- end }}
            # Plain variables
            {{- range $k, $v := .Values.deployment.env }}
            - name: {{ $k }}
              value: {{ $v | toString | quote }}
            {{- end }}
          {{- with .Values.deployment.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: pvmss-data
              mountPath: /data
            {{- if .Values.persistence.logs.enabled }}
            - name: pvmss-logs
              mountPath: /data/logs
            {{- end }}
          resources:
            {{- toYaml .Values.deployment.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: pvmss-data
          {{- if .Values.persistence.db.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "pvmss.fullname" . }}-db-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.persistence.logs.enabled }}
        - name: pvmss-logs
          persistentVolumeClaim:
            claimName: {{ include "pvmss.fullname" . }}-logs-pvc
        {{- end }}
