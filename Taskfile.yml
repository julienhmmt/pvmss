version: '3'

tasks:
  default: task --list

  go-coverage:
    desc: Run unit tests with coverage
    dir: backend
    cmds:
      - 'go test ./... -count=1 -coverprofile=coverage.out -covermode=atomic 2>&1 && go tool cover -func=coverage.out'

  go-update:
    desc: Update go version in all Go modules
    cmds:
      - for: ['backend']
        cmd: cd {{.ITEM}} && go get -u all && go mod tidy -v && go clean -cache -v

  go-lint:
    desc: Run go fmt and go vet in all Go modules
    cmds:
      - for: ['backend']
        cmd: cd {{.ITEM}} && go fmt ./... && go vet ./... && golangci-lint run -v --timeout=2m

  dev:
    desc: Start the full stack
    cmds:
      - docker compose -f docker-compose.dev.yml up -d --build
      - docker compose -f docker-compose.dev.yml ps

  dev-down:
    desc: Stop and remove the dev stack
    cmds:
      - docker compose -f docker-compose.dev.yml down

  dev-logs:
    desc: Follow logs from all services
    cmds:
      - docker compose -f docker-compose.dev.yml logs -f
