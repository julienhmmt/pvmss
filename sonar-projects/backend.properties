# SonarQube project: backend (legacy Go REST API, module pvmss)
sonar.projectKey=pvmss-backend
sonar.projectName=PVMSS Backend (legacy)
sonar.projectVersion=0.3.0

sonar.sources=backend
sonar.tests=backend
sonar.test.inclusions=**/*_test.go
sonar.language=go

sonar.exclusions=\
  **/vendor/**,\
  **/tmp/**,\
  **/*.db,\
  **/*.db-*

sonar.go.coverage.reportPaths=.sonar/backend-coverage.out

sonar.coverage.exclusions=**/*_test.go,**/tests/**

sonar.sourceEncoding=UTF-8
