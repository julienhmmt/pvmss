# SonarQube project: server (next-gen Go backend, module pvmss/server)
sonar.projectKey=pvmss-server
sonar.projectName=PVMSS backend
sonar.projectVersion=0.4.0

sonar.sources=server
sonar.tests=server
sonar.test.inclusions=**/*_test.go
sonar.language=go

sonar.exclusions=\
  **/vendor/**,\
  **/tmp/**,\
  **/*.db,\
  **/*.db-*,\
  **/graphify-out/**,\
  **/.DS_Store

sonar.go.coverage.reportPaths=.sonar/server-coverage.out

sonar.coverage.exclusions=**/*_test.go

# ponytail: SCM disabled because sonarsource/sonar-scanner-cli is amd64-only
# and runs under Rosetta on Apple Silicon; its JGit blame step (SCM Publisher)
# intermittently stalls for >3min and hangs the scan. SCM blame only feeds
# issue assignee + the non-default "specific developer" new-code period, neither
# of which this project uses. Upgrade path: run the scanner natively on arm64
# (brew install sonar-scanner, or a custom arm64 image) and drop this line.
sonar.scm.disabled=true

sonar.sourceEncoding=UTF-8
