# Classic nginx WebSocket recipe. nginx does not advertise RFC 8441, so
# browsers fall back to an HTTP/1.1 connection for the WebSocket.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 50001 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /certs/tls.crt;
  ssl_certificate_key /certs/tls.key;

  # Docker's DNS plus a variable upstream: nginx re-resolves pvmss-dev
  # instead of keeping the IP it saw at startup.
  resolver 127.0.0.11 valid=5s;
  set $pvmss http://pvmss-dev:50000;

  location / {
    proxy_pass $pvmss;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
  }
}
