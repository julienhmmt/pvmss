# Mirrors the production setup that broke the console: TLS with HTTP/2
# (browsers open WebSockets as RFC 8441 extended CONNECT) and a Host header
# rewritten to an internal name with no X-Forwarded-Host, like an external
# HAProxy in front of a Kubernetes Gateway.
global
  log stdout format raw local0 info

# Docker's DNS: follow pvmss-dev across container recreations.
resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 5s

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 30s
  timeout server 30s
  # Console WebSockets stay idle for long stretches.
  timeout tunnel 1h

frontend https
  # mTLS: browsers must present a client cert signed by the dev CA.
  bind :50000 ssl crt /certs/haproxy.pem ca-file /certs/ca.crt verify required alpn h2,http/1.1
  default_backend pvmss

backend pvmss
  http-request set-header X-Forwarded-Proto https
  http-request set-header Host pvmss.internal
  # mTLS to pvmss-dev: verify its cert, present the proxy client cert.
  server pvmss pvmss-dev:50000 resolvers docker init-addr last,libc,none ssl verify required ca-file /certs/ca.crt crt /certs/proxy-client.pem sni str(pvmss-dev) verifyhost pvmss-dev alpn http/1.1
