sonar.projectKey=pvmss
sonar.projectName=PVMSS
sonar.projectVersion=0.3.0

# Analyze the Go backends and the TypeScript sources of both SvelteKit apps.
# Svelte components are not supported by SonarQube Community Build, so they
# are excluded from JavaScript/TypeScript analysis to avoid parser errors.
sonar.sources=backend,frontend/src,server,web/src

sonar.exclusions=\
  **/*.svelte,\
  **/*.svelte.ts,\
  **/*.svelte.js,\
  **/node_modules/**,\
  **/build/**,\
  **/.svelte-kit/**,\
  **/vendor/**,\
  **/tmp/**,\
  **/graphify-out/**,\
  **/.devin/**,\
  **/.claude/**,\
  **/.agents/**,\
  **/.specify/**,\
  **/*.log,\
  **/*.db,\
  **/*.db-*,\
  **/pvmss,\
  **/noVNC*/**,\
  **/specs/**

# Go coverage reports (rewritten by `make sonar-coverage` so that module paths
# match the repository layout).
sonar.typescript.tsconfigPaths=frontend/tsconfig.json,web/tsconfig.json

sonar.go.coverage.reportPaths=.sonar/backend-coverage.out,.sonar/server-coverage.out

# Do not expect coverage data for the frontend TypeScript code or for Go tests.
sonar.coverage.exclusions=\
  **/*_test.go,\
  **/tests/**,\
  frontend/**,\
  web/**

sonar.sourceEncoding=UTF-8
