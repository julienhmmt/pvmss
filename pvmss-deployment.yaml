apiVersion: v1
kind: Namespace
metadata:
  name: pvmss
---
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: true
metadata:
  name: pvmss-sa
  namespace: pvmss
---
apiVersion: v1
kind: Secret
metadata:
  name: pvmss-secrets
type: Opaque
data:
  # base64 values. admin-password-hash: bcrypt hash (or empty to disable the
  # local admin login). session-secret: 32+ bytes (openssl rand -hex 32).
  admin-password-hash: changemebase64hash
  pve-api-token: changemebase64hash
  session-secret: changemebase64hash
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvmss-data-pvc
  namespace: pvmss
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: ""  # Use default storage class, or uncomment to specify a custom storage class
---
# Optional, for logs persistence
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvmss-logs-pvc
  namespace: pvmss
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: ""  # Use default storage class, or uncomment to specify a custom storage class
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvmss
  namespace: pvmss
  labels:
    app.kubernetes.io/name: pvmss
    app.kubernetes.io/instance: pvmss
    app.kubernetes.io/version: "0.4.0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pvmss
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pvmss
    spec:
      automountServiceAccountToken: true
      serviceAccountName: pvmss-sa
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 5
      restartPolicy: Always
      containers:
        - name: pvmss
          image: jhmmt/pvmss:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: backend
              containerPort: 50000
              protocol: TCP
          # Every variable is validated at boot by server/internal/config/load.go;
          # the pod crash-loops if a required one is missing or malformed.
          env:
            # Required. "proxmox" for a real cluster; "fake" serves demo data
            # with demo credentials and must never be selected by accident.
            - name: PVMSS_CLUSTER_SOURCE
              value: "proxmox"
            - name: PROXMOX_URL
              value: "https://changeme:8006/api2/json"
            - name: PROXMOX_API_TOKEN_NAME
              value: "user@pve!token"
            - name: PROXMOX_API_TOKEN_VALUE
              valueFrom:
                secretKeyRef:
                  name: pvmss-secrets
                  key: pve-api-token
            - name: PVMSS_PORT
              value: "50000"
            - name: PVMSS_DB_PATH
              value: "/data/pvmss.db"
            # Bind all interfaces inside the container; the Service controls exposure.
            - name: PVMSS_HOST
              value: "0.0.0.0"
            - name: PVMSS_WEB_DIR
              value: "/app/web/build"
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: pvmss-secrets
                  key: session-secret
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: pvmss-secrets
                  key: admin-password-hash
            # Lowercase only: debug | info | warn | error
            - name: LOG_LEVEL
              value: "info"
            - name: LOG_FORMAT
              value: "json"
            # stdout, stderr, or a file path on the logs volume, e.g. /data/logs/pvmss.log
            - name: LOG_OUTPUT
              value: "stdout"
            # Set to "false" only when the HTTPRoute/Ingress does not terminate TLS.
            - name: PVMSS_COOKIE_SECURE
              value: "true"
            # Reverse proxies in front of PVMSS (client IP for rate limits / audit).
            - name: PVMSS_TRUSTED_PROXY_HOPS
              value: "1"
            - name: TZ
              value: "Europe/Paris"
            # Cloud-init templates (optional): PVMSS's SSH private key.
            # - name: PVMSS_SSH_KEY_FILE
            #   value: /etc/pvmss/ssh/id_ed25519
          volumeMounts:
            - name: pvmss-data
              mountPath: /data
              readOnly: false
            - name: pvmss-logs
              mountPath: /data/logs
              readOnly: false
            # Cloud-init templates are published to the Proxmox nodes over
            # SSH: mount PVMSS's private key from a Secret
            # (kubectl create secret generic pvmss-ssh --from-file=id_ed25519=...)
            # and uncomment PVMSS_SSH_KEY_FILE above. SSH user, port and
            # pinned host keys are set per cluster in Infrastructure > Clusters.
            # - name: ssh-key
            #   mountPath: /etc/pvmss/ssh
            #   readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "50m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: pvmss-data
          persistentVolumeClaim:
            claimName: pvmss-data-pvc
        - name: pvmss-logs
          persistentVolumeClaim:
            claimName: pvmss-logs-pvc
        # - name: ssh-key
        #   secret:
        #     secretName: pvmss-ssh
        #     defaultMode: 0440
---           
apiVersion: v1
kind: Service
metadata:
  name: pvmss
  namespace: pvmss
spec:
  selector:
    app.kubernetes.io/name: pvmss
    app.kubernetes.io/instance: pvmss
    app.kubernetes.io/version: "0.4.0"
  ports:
    - name: backend
      protocol: TCP
      port: 50000
      targetPort: 50000
