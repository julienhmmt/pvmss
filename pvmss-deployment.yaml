apiVersion: v1
kind: Namespace
metadata:
  name: pvmss
---
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: true
metadata:
  name: pvmss-sa
  namespace: pvmss
---
apiVersion: v1
kind: Secret
metadata:
  name: pvmss-secrets
type: Opaque
data:
  admin-password-hash: changemebase64hash
  jwt-secret: changemebase64hash
  pve-api-token: changemebase64hash
  session-secret: changemebase64hash
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvmss-data-pvc
  namespace: pvmss
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: ""  # Use default storage class, or uncomment to specify a custom storage class
---
# Optional, for logs persistence
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvmss-logs-pvc
  namespace: pvmss
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: ""  # Use default storage class, or uncomment to specify a custom storage class
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pvmss
  namespace: pvmss
  labels:
    app.kubernetes.io/name: pvmss
    app.kubernetes.io/instance: pvmss
    app.kubernetes.io/version: "0.4.0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pvmss
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pvmss
    spec:
      automountServiceAccountToken: true
      serviceAccountName: pvmss-sa
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      terminationGracePeriodSeconds: 5
      restartPolicy: Always
      containers:
        - name: pvmss
          image: jhmmt/pvmss:0.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: backend
              containerPort: 50000
              protocol: TCP
          env:
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: pvmss-secrets
                  key: admin-password-hash
            - name: LOG_LEVEL
              value: "INFO"
            - name: LOG_OUTPUT
              value: "stdout"
            - name: LOG_FORMAT
              value: "json"
            # To also write logs to a dedicated logs volume, you can change
            # LOG_OUTPUT to "both" and add, for example:
            # - name: LOG_FILE_PATH
            #   value: "/data/logs/pvmss.log"
            - name: PROXMOX_API_TOKEN_NAME
              value: "changeme"
            - name: PROXMOX_API_TOKEN_VALUE
              valueFrom:
                secretKeyRef:
                  name: pvmss-secrets
                  key: pve-api-token
            # Set to "false" ONLY for self-signed labs; mount the Proxmox CA cert for production.
            - name: PROXMOX_VERIFY_SSL
              value: "true"
            - name: PROXMOX_URL
              value: "https://changeme:8006/api2/json"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pvmss-secrets
                  key: jwt-secret
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: pvmss-secrets
                  key: session-secret
            - name: PVMSS_ENV
              value: "production" # Can be 'dev', 'developpement', 'prod'
            - name: PVMSS_OFFLINE
              value: "false" # Set to true to disable Proxmox connection
            - name: PVMSS_DB_PATH
              value: "/data/pvmss.db"
            - name: TZ
              value: "Europe/Paris"
          volumeMounts:
            - name: pvmss-data
              mountPath: /data
              readOnly: false
            - name: pvmss-logs
              mountPath: /data/logs
              readOnly: false
          resources:
            requests:
              memory: "64Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "50m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: pvmss-data
          persistentVolumeClaim:
            claimName: pvmss-data-pvc
        - name: pvmss-logs
          persistentVolumeClaim:
            claimName: pvmss-logs-pvc
---           
apiVersion: v1
kind: Service
metadata:
  name: pvmss
  namespace: pvmss
spec:
  selector:
    app.kubernetes.io/name: pvmss
    app.kubernetes.io/instance: pvmss
    app.kubernetes.io/version: "0.4.0"
  ports:
    - name: backend
      protocol: TCP
      port: 50000
      targetPort: 50000
